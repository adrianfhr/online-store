steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/online-store', '.']

  # Step 2: Push Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/online-store']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'online-store',
      '--image', 'gcr.io/$PROJECT_ID/online-store',
      '--region', 'asia-southeast2', # Sesuaikan region
      '--platform', 'managed',
      '--allow-unauthenticated'
    ]

# Optional: Time limit for the build
timeout: 1200s

# Service account to execute the build

# Build options
options:
  logging: CLOUD_LOGGING_ONLY # Menyimpan log di Cloud Logging
  default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET
