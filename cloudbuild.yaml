steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/online-store', '.']

  # Step 2: Push Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/online-store']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'online-store',
      '--image', 'gcr.io/$PROJECT_ID/online-store',
      '--region', 'asia-southeast2', # Sesuaikan dengan region Anda
      '--platform', 'managed',
      '--allow-unauthenticated'
    ]

timeout: 1200s
